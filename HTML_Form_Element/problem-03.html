<!DOCTYPE html>
<html lang="en">
<head>
    <title>online course</title>
</head>
<body>
<h2>Online Course Enrollment</h2>
<p>Complete this registration form for enrollment in a technical course, including personal details, course preferences, background, and learning goals.</p>
<img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=800&q=80" alt="Students learning online" width="500">
<p><a href="https://www.example.com/courses" target="_blank">View Course Information</a></p>

<form >

    <p>
        <label for="studentName">Student Name:</label><br>
        <input type="text" id="studentName" name="studentName" required minlength="3" maxlength="60">
    </p>
    <p>
        <label for="studentEmail">Email:</label><br>
        <input type="email" id="studentEmail" name="studentEmail" required>
    </p>
    <p>
        <label for="studentPassword">Password:</label><br>
        <input type="password" id="studentPassword" name="studentPassword" required minlength="8" maxlength="30">
    </p>
    <p>
        <label for="studentMobile">Mobile Number:</label><br>
        <input type="tel" id="studentMobile" name="studentMobile" required pattern="[0-9]{10}" maxlength="10">
    </p>
    <p><label for="studentDob">Date of Birth:</label><br>
        <input type="date" id="studentDob" name="studentDob" required max="2026-08-31">
    </p>
    <p><label for="courseName">Course:</label><br>
        <select id="courseName" name="courseName" required>
            <option value="">-- Select Course --</option>
            <option>Java</option><option>Python</option>
            <option>Web Development</option><option>Data Structures</option>
            <option>Database</option>
        </select>
    </p>
    <p>
        <label for="batch">Batch / Session:</label><br>
        <select id="batch" name="batch" required>
            <option value="">-- Select Batch --</option>
            <option>Morning Weekday</option>
            <option>Afternoon Weekday</option>
            <option>Evening Weekday</option>
            <option>Morning Weekend</option>
            <option>Evening Weekend</option>
        </select>
    </p>
    <p>
        <strong>Learning Preference:</strong><br>
        <input type="radio" id="online" name="learningPreference" value="online" required>
        <label for="online">Online</label>
        <input type="radio" id="offline" name="learningPreference" value="offline">
        <label for="offline">Offline</label>
        <input type="radio" id="hybrid" name="learningPreference" value="hybrid">
        <label for="hybrid">Hybrid</label>
    </p>
    <p>
        <strong>Programming Experience:</strong><br>
        <input type="checkbox" id="javaExp" name="programmingExperience" value="java">
        <label for="javaExp">Java</label>
        <input type="checkbox" id="pythonExp" name="programmingExperience" value="python">
        <label for="pythonExp">Python</label>
        <input type="checkbox" id="webExp" name="programmingExperience" value="web-development">
        <label for="webExp">Web Development</label>
        <input type="checkbox" id="dsExp" name="programmingExperience" value="data-structures">
        <label for="dsExp">Data Structures</label>
        <input type="checkbox" id="dbExp" name="programmingExperience" value="database">
        <label for="dbExp">Database</label></p>
    <p>
        <label for="educationLevel">Education Level:</label><br>
        <select id="educationLevel" name="educationLevel" required>
            <option value="">-- Select --</option>
            <option>High School</option>
            <option>Diploma</option>
            <option>Undergraduate</option>
            <option>Postgraduate</option>
        </select>
    </p>
    <p>
        <label for="institution">College / Institution:</label><br>
        <input type="text" id="institution" name="institution" required minlength="2" maxlength="100"></p>
    <p>
        <label for="semester">Current Semester / Year:</label><br>
        <input type="text" id="semester" name="semester" required maxlength="30"></p>
    <p>
        <label for="experience">Programming Experience (Years):</label><br>
        <input type="number" id="experience" name="experience" min="0" max="30" step="0.5" required></p>
    <p>
        <label for="portfolio">GitHub / Portfolio URL:</label><br>
        <input type="url" id="portfolio" name="portfolio" placeholder="https://example.com">
    </p>
    <p>
        <label for="learningGoals">Learning Goals:</label><br>
        <textarea id="learningGoals" name="learningGoals" rows="5" cols="50" required minlength="10" maxlength="500"></textarea></p>
    <p>
        <input type="checkbox" id="registrationConfirmation" name="registrationConfirmation" required>
        <label for="registrationConfirmation">I confirm that the information provided is accurate.</label></p>
    <p><input type="submit" value="Register">
        <input type="reset" value="Reset"></p>
</form>

</body>
